<!doctype html>
<html lang="en">

<head>

  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title & Description (DEFAULT – React will update per page) -->
  <!-- Title & Description (Managed by React Helmet) -->

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="/images/logo_dark.webp" />

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="XAwAAIJFhdmPbjdfM8ChJplxzfw4lh-BcpJcUrUHT3c" />

  <!-- Preconnect for Performance -->
  <link rel="preload" as="image" href="/images/banner2_mobile.webp" media="(max-width: 639.98px)"
    fetchpriority="high" />
  <link rel="preload" as="image" href="/images/banner2_tablet.webp"
    media="(min-width: 640px) and (max-width: 1023.98px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/banner2_desktop.webp" media="(min-width: 1024px)" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Optimized Font Loading -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;600;700&display=swap" />
  </noscript>



  <!-- Open Graph & Twitter & Schema managed by React Helmet Async -->

  <!-- Google Tag Manager (Deferred for performance) -->
  <script>
    window.addEventListener('load', function() {
      var initGTM = function() {
        (function(w,d,s,l,i){
          w[l] = w[l] || [];
          w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
          var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-NHQBRDLJ');
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(initGTM, { timeout: 2500 });
      } else {
        setTimeout(initGTM, 1500);
      }
    });
  </script>
  <!-- End Google Tag Manager -->
</head>

  <!-- End Google Tag Manager (noscript) -->
