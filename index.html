  <!-- Defer Analytics Scripts (GTM & GA4) for Performance Optimization -->
  <script>
    (function () {
      var gtmId = '%VITE_GTM_ID%';
      var gaId = 'G-7XL0JYX4CZ';
      var scriptsLoaded = false;

      function loadAnalytics() {
        if (scriptsLoaded) return;
        scriptsLoaded = true;

        // Remove event listeners
        events.forEach(function (event) {
          window.removeEventListener(event, loadAnalytics, { passive: true });
        });

        // Load GTM
        if (gtmId && gtmId !== 'GTM-XXXXXXX') {
          window.dataLayer.push({
            'gtm.start': new Date().getTime(),
            event: 'gtm.js'
          });
          var f = document.getElementsByTagName('script')[0];
          var j = document.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + gtmId;
          f.parentNode.insertBefore(j, f);
        }

        // Load GA4
        if (gaId) {
          var script = document.createElement('script');
          script.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
          script.async = true;
          document.head.appendChild(script);

          window.gtag = window.gtag || function () { dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', gaId);
        }
      }

      var events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'];
      events.forEach(function (event) {
        window.addEventListener(event, loadAnalytics, { passive: true });
      });

      // Load after 4 seconds fallback
      setTimeout(loadAnalytics, 4000);
    })();
  </script>
