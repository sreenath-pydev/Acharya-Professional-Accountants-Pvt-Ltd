      {

        "logo": "https://acharyaprofessionalaccountants.in/images/logo_dark.webp"
      }
    </script>

  <!-- Defer Google Analytics (GA4) -->
  <script>
    // Lazy load GTM
    (function () {
      var gtmId = 'G-CEXGQV30H8';
      var scriptLoaded = false;

      function loadGTM() {
        if (scriptLoaded) return;
        scriptLoaded = true;

        var script = document.createElement('script');
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + gtmId;
        script.async = true;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', gtmId);
      }

      // Load on interaction
      var events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'];
      function onInteraction() {
        loadGTM();
        events.forEach(function (event) {
          window.removeEventListener(event, onInteraction, { passive: true });
        });
      }

      events.forEach(function (event) {
        window.addEventListener(event, onInteraction, { passive: true });
      });

      // Load after timeout (fallback)
      setTimeout(loadGTM, 4000);
    })();
  </script>
</head>
